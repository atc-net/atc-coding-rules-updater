name: "Integration-Tests"

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC daily. The analyzer providers scrape live documentation pages, so breakage
    # arrives without any commit to this repository and is otherwise invisible.
    - cron: '0 4 * * *'

permissions:
  contents: read
  issues: write

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ⚙️ Setup dotnet 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔁 Restore packages
        run: dotnet restore

      - name: 🛠️ Build
        run: dotnet build -c Release --no-restore

      # A single retry: the providers hit ~13 external documentation sites, and a cold run can
      # return partial data on a transient hiccup. RetryHelper in the test project cannot cover
      # this today because CollectBaseRules swallows its own exceptions and returns degraded
      # data instead of throwing, so the assertions fail outside the retry.
      - name: 🧪 Run integration tests
        id: integration
        run: |
          dotnet test -c Release --no-build --filter-query "/[category=integration]" \
            || (echo "::warning::First attempt failed - retrying once" \
                && dotnet test -c Release --no-build --filter-query "/[category=integration]")

      - name: 🐛 Report scraper breakage
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'scraper-breakage';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)} - ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Analyzer provider integration tests are failing',
              labels: [label],
              body: [
                'The scheduled integration test run failed twice in a row.',
                '',
                `Run: ${runUrl}`,
                '',
                'The analyzer providers scrape live documentation pages. A failure here usually',
                'means an upstream page changed layout and a provider needs updating. Note that',
                '`AnalyzerProviderBase.CollectBaseRules` falls back to a cached snapshot on',
                'failure, so the CLI itself may keep working while the rule data silently goes',
                'stale.',
              ].join('\n'),
            });